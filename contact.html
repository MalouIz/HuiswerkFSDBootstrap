    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Welkom</a>
            
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">

      <div class="collapse navbar-collapse" id="navbarNav">

          </li>
        </ul>
      </div>

  <div class="container-sm my-4">
    <h1>Contact</h1>
    <p>Heb je vragen, wil je samenwerken of gewoon een praatje maken? Neem gerust contact.</p>
  </div>

  <form action="#" method="POST" class="Form"> 
    <div class="row mb-3 align-items-center">
      <label for="naam-input" class="col-sm-2 col-form-label fw-bold">Naam</label>
      <div class="col-sm-10">
        <input type="text" class="form-control" id="naam-input" placeholder="Naam">
      </div>
    </div>
      
    <div class="row mb-3 align-items-center">
      <label for="email-input" class="col-sm-2 col-form-label fw-bold">Email</label>
      <div class="col-sm-10">
        <input type="email" class="form-control" id="email-input" placeholder="E-mailadres">
      </div>
    </div>
      
    <div class="row mb-3">
      <label for="bericht-input" class="col-sm-2 col-form-label fw-bold">Bericht</label>
      <div class="col-sm-10">
        <textarea class="form-control" id="bericht-input" rows="4" placeholder="Bericht"></textarea>
      </div>
    </div>
      
    <div class="row">
      <div class="col-sm-10 offset-sm-2">
        <button type="submit" class="btn btn-primary">Verzend</button>
      </div>
    </div>

  </form>
